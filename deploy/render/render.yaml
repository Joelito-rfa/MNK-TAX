# Blueprint Render — MNK-TAX (plan gratuit Hobby)
# Déploiement : Render Dashboard → New → Blueprint → choisir ce repo
#
# Les variables marquées `sync: false` doivent être remplies manuellement
# (Render ne stocke jamais leur valeur dans le dépôt).
services:
  - type: web
    name: mnk-tax
    runtime: docker
    plan: free
    repo: https://github.com/Joelito-rfa/MNK-TAX
    dockerContext: .
    dockerfilePath: deploy/render/Dockerfile
    region: ohio
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SEED_DEMO
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RECEIPT_BASE_URL
        sync: false