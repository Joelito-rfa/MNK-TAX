# Blueprint Render — MNK-TAX (plan gratuit Hobby)
# Déploiement : Render Dashboard → New → Blueprint → choisir ce repo
#
# Les variables marquées `sync: false` doivent être remplies manuellement
# (Render ne stocke jamais leur valeur dans le dépôt).
services:
  - type: web
    name: mnk-tax
    runtime: docker
    plan: free
    repo: https://github.com/Joelito-rfa/MNK-TAX
    dockerContext: .
    dockerfilePath: deploy/render/Dockerfile
    region: ohio
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SEED_DEMO
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Planificateur
      - key: COMM_SCHEDULER_CRON
        value: "0 15 7 * * *"
      - key: OVERDUE_SCHEDULER_CRON
        value: "0 30 6 * * *"
      - key: DEADLINE_SCHEDULER_CRON
        value: "0 0 7 * * *"
      - key: SCHEDULER_TIMEZONE
        value: "Indian/Antananarivo"
      - key: SCHEDULER_POOL_SIZE
        value: "4"
      - key: COMM_QUEUE_POLL_DELAY_MS
        value: "20000"
      - key: COMM_DEMO_PROVIDER
        sync: false
      # Fournisseurs de communication
      - key: SMS_PROVIDER
        value: "none"
      - key: SMS_ACCOUNT_SID
        sync: false
      - key: SMS_AUTH_TOKEN
        sync: false
      - key: SMS_FROM_NUMBER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: "no-reply@mnk-tax.mg"
      - key: MAIL_FROM_NAME
        value: "MNK-TAX — Administration fiscale"
      - key: MAIL_BASE_URL
        sync: false
      - key: RECEIPT_BASE_URL
        sync: false