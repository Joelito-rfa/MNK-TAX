services:
  - type: web
    name: mnk-tax-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://mnk-tax.onrender.com
      - key: RECEIPT_BASE_URL
        value: https://mnk-tax.onrender.com
      - key: SEED_DEMO
        value: "true"
      - key: SERVER_PORT
        value: "10000"
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx384m -XX:+UseG1GC -XX:+UseStringDeduplication"

  - type: static
    name: mnk-tax-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mnk-tax-api.onrender.com
