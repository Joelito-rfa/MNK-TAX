services:
  - type: web
    name: mnk-tax-api
    runtime: docker
    rootDir: backend
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://mnk-tax-frontend.onrender.com
      - key: RECEIPT_BASE_URL
        value: https://mnk-tax-frontend.onrender.com
      - key: SEED_DEMO
        value: "true"
      - key: SERVER_PORT
        value: "10000"
      # Planificateur
      - key: COMM_SCHEDULER_CRON
        value: "0 15 7 * * *"
      - key: OVERDUE_SCHEDULER_CRON
        value: "0 30 6 * * *"
      - key: DEADLINE_SCHEDULER_CRON
        value: "0 0 7 * * *"
      - key: SCHEDULER_TIMEZONE
        value: "Indian/Antananarivo"
      - key: SCHEDULER_POOL_SIZE
        value: "4"
      - key: COMM_QUEUE_POLL_DELAY_MS
        value: "20000"
      - key: COMM_DEMO_PROVIDER
        value: "true"
      # Fournisseurs de communication
      - key: SMS_PROVIDER
        value: "none"
      - key: SMS_ACCOUNT_SID
        sync: false
      - key: SMS_AUTH_TOKEN
        sync: false
      - key: SMS_FROM_NUMBER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: "no-reply@mnk-tax.mg"
      - key: MAIL_FROM_NAME
        value: "MNK-TAX — Administration fiscale"
      - key: MAIL_BASE_URL
        value: "https://mnk-tax-frontend.onrender.com"
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx384m -XX:+UseG1GC -XX:+UseStringDeduplication"

  - type: web
    name: mnk-tax-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mnk-tax-api.onrender.com
