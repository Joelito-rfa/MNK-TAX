spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 20000
      pool-name: mnktax-pool
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

mnk-tax:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://mnk-tax.onrender.com}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
  receipt:
    base-url: ${RECEIPT_BASE_URL:https://mnk-tax.onrender.com}
    storage-dir: ${RECEIPT_STORAGE_DIR:/app/data/receipts}
  document:
    storage-dir: ${DOCUMENT_STORAGE_DIR:/app/data/documents}
  avatar:
    storage-dir: ${AVATAR_STORAGE_DIR:/app/data/avatars}
  seed-demo: ${SEED_DEMO:false}