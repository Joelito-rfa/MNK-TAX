spring:
  config:
    activate:
      on-profile: render
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:10000}

mnk-tax:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://mnk-tax.onrender.com}
  rate-limit:
    enabled: false
  receipt:
    base-url: ${RECEIPT_BASE_URL:https://mnk-tax.onrender.com}
  # Aucune donnée de démonstration en production, même si le blueprint oublie
  # de définir SEED_DEMO.
  seed-demo: ${SEED_DEMO:false}

logging:
  level:
    com.mnktax: INFO
    org.springframework.security: WARN
