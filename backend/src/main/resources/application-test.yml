spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:mnktax_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

mnk-tax:
  jwt:
    # Secret de test isolé : ne jamais réutiliser hors des tests.
    secret: dGVzdC1vbmx5LW1uay10YXgtand0LXNlY3JldC0wMDEtbmUtcGFzLXV0aWxpc2VyLWVuLXByb2Q=
  rate-limit:
    enabled: false
  receipt:
    base-url: http://localhost:5177
    storage-dir: ./target/test-receipts
  seed-demo: false
  # Les tests vérifient l'échec explicite sans fournisseur réel : pas de démo.
  communication:
    demo-provider:
      enabled: false
    queue:
      # Workers planifiés neutralisés : les tests appellent explicitement les
      # traitements pour rester déterministes (aucune course avec le scheduler).
      poll-initial-delay-ms: 3600000
      sweep-initial-delay-ms: 3600000
