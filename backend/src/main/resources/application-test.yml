spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:mnktax_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

mnk-tax:
  rate-limit:
    enabled: false
  receipt:
    base-url: http://localhost:5177
    storage-dir: ./target/test-receipts
  seed-demo: false
