server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: mnk-tax
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  task:
    scheduling:
      # Plusieurs crons quotidiens + le worker de file d'envoi partagent ce pool.
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: mnk-sched-
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mnk-tax:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLWludGVybmFsLXNlY3JldC1mb3ItbW5rLXRheC1wcm90b3R5cGUtMDAx}
    access-token-ttl: ${JWT_ACCESS_TTL:3600}
    refresh-token-ttl: ${JWT_REFRESH_TTL:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5177,http://localhost:3000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
  receipt:
    base-url: ${RECEIPT_BASE_URL:http://localhost:5177}
    storage-dir: ${RECEIPT_STORAGE_DIR:./data/receipts}
  scheduler:
    zone: ${SCHEDULER_TIMEZONE:Indian/Antananarivo}
    communication-cron: ${COMM_SCHEDULER_CRON:0 15 7 * * *}
    # Détection des retards (créances/obligations) à 06h30.
    overdue-cron: ${OVERDUE_SCHEDULER_CRON:0 30 6 * * *}
    # Notifications internes d'échéance aux agents à 07h00.
    deadline-cron: ${DEADLINE_SCHEDULER_CRON:0 0 7 * * *}
  document:
    storage-dir: ${DOCUMENT_STORAGE_DIR:./data/documents}
  avatar:
    storage-dir: ${AVATAR_STORAGE_DIR:./data/avatars}
  seed-demo: ${SEED_DEMO:true}
  security:
    # Swagger / H2-Console : à false en production (cf. application-prod.yml)
    expose-api-docs: ${EXPOSE_API_DOCS:true}
  communication:
    mail:
      # Réel uniquement si MAIL_HOST est défini — l'état effectif est vérifié sur MAIL_HOST
      enabled: ${MAIL_ENABLED:false}
      from-address: ${MAIL_FROM_ADDRESS:no-reply@mnk-tax.mg}
      from-name: ${MAIL_FROM_NAME:MNK-TAX — Administration fiscale}
      base-url: ${MAIL_BASE_URL:http://localhost:5177}
    sms:
      # Fournisseur SMS réel requis — aucun faux statut "envoyé" sans configuration
      enabled: ${SMS_ENABLED:false}
      provider: ${SMS_PROVIDER:none}
      account-sid: ${SMS_ACCOUNT_SID:}
      auth-token: ${SMS_AUTH_TOKEN:}
      from-number: ${SMS_FROM_NUMBER:}
    queue:
      batch-size: ${COMM_QUEUE_BATCH_SIZE:50}
      max-attempts: ${COMM_QUEUE_MAX_ATTEMPTS:3}
      retry-backoff-minutes: ${COMM_QUEUE_RETRY_BACKOFF_MINUTES:5}
      # Fréquence du worker de livraison (ms).
      poll-delay-ms: ${COMM_QUEUE_POLL_DELAY_MS:20000}
    # Fournisseur de démonstration (log uniquement) : permet à la démo de bout
    # en bout de fonctionner sans SMTP/Twilio réels. Désactivé en production
    # réelle si COMM_DEMO_PROVIDER=false (les envois passent alors en FAILED).
    demo-provider:
      enabled: ${COMM_DEMO_PROVIDER:true}
    test:
      email-recipient: ${COMM_TEST_EMAIL:}
      sms-recipient: ${COMM_TEST_SMS:}
logging:
  level:
    com.mnktax: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n"
