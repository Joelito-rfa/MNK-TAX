server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: mnk-tax
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  task:
    scheduling:
      # Plusieurs crons quotidiens + le worker de file d'envoi partagent ce pool.
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: mnk-sched-
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mnk-tax:
  jwt:
    # Obligatoire : aucun secret de repli n'est fourni par l'application.
    # En développement, application-dev.yml fournit une valeur locale explicite ;
    # en production, JWT_SECRET doit être injecté par le gestionnaire de secrets.
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:3600}
    refresh-token-ttl: ${JWT_REFRESH_TTL:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5177,http://localhost:3000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
  receipt:
    base-url: ${RECEIPT_BASE_URL:http://localhost:5177}
    storage-dir: ${RECEIPT_STORAGE_DIR:./data/receipts}
  scheduler:
    zone: ${SCHEDULER_TIMEZONE:Indian/Antananarivo}
    communication-cron: ${COMM_SCHEDULER_CRON:0 15 7 * * *}
    # Détection des retards (créances/obligations) à 06h30.
    overdue-cron: ${OVERDUE_SCHEDULER_CRON:0 30 6 * * *}
    # Notifications internes d'échéance aux agents à 07h00.
    deadline-cron: ${DEADLINE_SCHEDULER_CRON:0 0 7 * * *}
  document:
    storage-dir: ${DOCUMENT_STORAGE_DIR:./data/documents}
  avatar:
    storage-dir: ${AVATAR_STORAGE_DIR:./data/avatars}
  # Sécurité : désactivé par défaut. Le profil dev l'active explicitement.
  seed-demo: ${SEED_DEMO:false}
  security:
    # Swagger / H2-Console : à false en production (cf. application-prod.yml)
    expose-api-docs: ${EXPOSE_API_DOCS:true}
  communication:
    mail:
      # Fournisseur : smtp (défaut) ou mailersend (API HTTPS).
      provider: ${MAIL_PROVIDER:smtp}
      # Jeton API MailerSend — utilisé uniquement si provider=mailersend.
      api-token: ${MAILERSEND_API_TOKEN:}
      api-url: ${MAILERSEND_API_URL:https://api.mailersend.com/v1/email}
      # SMTP réel uniquement si MAIL_HOST est défini.
      # Ces propriétés sont liées par CommunicationProperties : elles fonctionnent
      # aussi bien avec les variables d'environnement qu'avec .env.local (profil dev).
      enabled: ${MAIL_ENABLED:false}
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      smtp-auth: ${MAIL_SMTP_AUTH:true}
      starttls: ${MAIL_SMTP_STARTTLS:true}
      # Port 465 : activer MAIL_SMTP_SSL=true (ou laisser le port 465 l'activer).
      ssl: ${MAIL_SMTP_SSL:false}
      ssl-trust: ${MAIL_SMTP_SSL_TRUST:}
      debug: ${MAIL_DEBUG:false}
      from-address: ${MAIL_FROM_ADDRESS:no-reply@mnk-tax.mg}
      from-name: ${MAIL_FROM_NAME:MNK-TAX — Administration fiscale}
      base-url: ${MAIL_BASE_URL:http://localhost:5177}
    sms:
      # Fournisseur SMS réel requis — aucun faux statut "envoyé" sans configuration
      enabled: ${SMS_ENABLED:false}
      provider: ${SMS_PROVIDER:none}
      account-sid: ${SMS_ACCOUNT_SID:}
      auth-token: ${SMS_AUTH_TOKEN:}
      from-number: ${SMS_FROM_NUMBER:}
    queue:
      batch-size: ${COMM_QUEUE_BATCH_SIZE:50}
      max-attempts: ${COMM_QUEUE_MAX_ATTEMPTS:3}
      retry-backoff-minutes: ${COMM_QUEUE_RETRY_BACKOFF_MINUTES:5}
      # Fréquence du worker de livraison (ms).
      poll-delay-ms: ${COMM_QUEUE_POLL_DELAY_MS:20000}
      poll-initial-delay-ms: ${COMM_QUEUE_POLL_INITIAL_DELAY_MS:8000}
      # Filet de sécurité : relance automatique des emails en échec définitif
      # (erreurs temporaires uniquement) après épuisement des tentatives.
      auto-retry-enabled: ${COMM_QUEUE_AUTO_RETRY_ENABLED:true}
      auto-retry-max-cycles: ${COMM_QUEUE_AUTO_RETRY_MAX_CYCLES:6}
      auto-retry-max-age-hours: ${COMM_QUEUE_AUTO_RETRY_MAX_AGE_HOURS:72}
      # Délai progressif entre deux cycles : base × (cycle + 1).
      auto-retry-backoff-minutes: ${COMM_QUEUE_AUTO_RETRY_BACKOFF_MINUTES:15}
      # Livraison SENDING sans mise à jour depuis N minutes → reprise.
      stale-sending-minutes: ${COMM_QUEUE_STALE_SENDING_MINUTES:10}
      # Fréquence du balayage de relance automatique (ms).
      sweep-delay-ms: ${COMM_QUEUE_SWEEP_DELAY_MS:60000}
      sweep-initial-delay-ms: ${COMM_QUEUE_SWEEP_INITIAL_DELAY_MS:20000}
    # Fournisseur de démonstration (log uniquement) : permet à la démo de bout
    # en bout de fonctionner sans SMTP/Twilio réels. Désactivé en production
    # réelle si COMM_DEMO_PROVIDER=false (les envois passent alors en FAILED).
    demo-provider:
      enabled: ${COMM_DEMO_PROVIDER:true}
    test:
      email-recipient: ${COMM_TEST_EMAIL:}
      sms-recipient: ${COMM_TEST_SMS:}
logging:
  level:
    com.mnktax: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n"
