spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:mnktax;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

mnk-tax:
  jwt:
    # Valeur locale uniquement, jamais utilisée en production : le profil dev
    # reste utilisable sans variable d'environnement, mais tout autre profil
    # exige JWT_SECRET (voir application.yml).
    secret: ${JWT_SECRET:ZGV2LW9ubHktbW5rLXRheC1qd3Qtc2VjcmV0LTAwMS1uZS1wYXMtdXRpbGlzZXItZW4tcHJvZA==}
  rate-limit:
    enabled: false
  receipt:
    base-url: http://localhost:5177
  # Données fictives activées explicitement en développement local.
  seed-demo: ${SEED_DEMO:true}
