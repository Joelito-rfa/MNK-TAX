<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="55%" stop-color="#c5cae9"/>
      <stop offset="100%" stop-color="#9fa8da"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f6fb"/>
      <stop offset="100%" stop-color="#d7dcef"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b7bede"/>
      <stop offset="100%" stop-color="#8d94b8"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b6f8f"/>
      <stop offset="100%" stop-color="#4d5170"/>
    </linearGradient>
    <linearGradient id="mon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31386b"/>
      <stop offset="100%" stop-color="#1e2350"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- Fond -->
  <rect width="1600" height="500" fill="url(#sky)"/>
  <ellipse cx="1250" cy="70" rx="380" ry="130" fill="#ffffff" opacity="0.35" filter="url(#blur24)"/>

  <!-- Fenêtres -->
  <g opacity="0.5">
    <rect x="1020" y="40" width="200" height="240" rx="10" fill="#ffffff" opacity="0.4"/>
    <rect x="1260" y="40" width="200" height="240" rx="10" fill="#ffffff" opacity="0.3"/>
    <rect x="1035" y="55" width="170" height="210" rx="6" fill="#dce4f5"/>
    <rect x="1275" y="55" width="170" height="210" rx="6" fill="#dce4f5"/>
    <line x1="1120" y1="55" x2="1120" y2="265" stroke="#ffffff" stroke-width="6" opacity="0.7"/>
    <line x1="1360" y1="55" x2="1360" y2="265" stroke="#ffffff" stroke-width="6" opacity="0.7"/>
  </g>

  <!-- Drapeau malgache stylisé (rouge/vert/blanc, discret) -->
  <g opacity="0.6">
    <rect x="60" y="46" width="84" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="60" y="46" width="28" height="28" fill="#c8102e" rx="6" clip-path="url(#flagclip)"/>
    <rect x="60" y="74" width="28" height="28" fill="#007e3a" clip-path="url(#flagclip)"/>
    <rect x="88" y="46" width="56" height="56" fill="#f5f5f5" clip-path="url(#flagclip)"/>
    <clipPath id="flagclip"><rect x="60" y="46" width="84" height="56" rx="6"/></clipPath>
    <rect x="60" y="46" width="84" height="56" rx="6" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Mur -->
  <rect y="280" width="1600" height="130" fill="url(#wall)"/>
  <!-- Sols -->
  <rect y="410" width="1600" height="90" fill="url(#floor)"/>
  <rect y="406" width="1600" height="6" fill="#ffffff" opacity="0.35"/>

  <!-- Étagère / dossiers -->
  <g>
    <rect x="180" y="150" width="230" height="130" rx="8" fill="#ffffff" opacity="0.55"/>
    <rect x="196" y="196" width="198" height="8" rx="4" fill="#8b93bd"/>
    <g>
      <rect x="208" y="162" width="14" height="30" rx="2" fill="#e05c5c" transform="rotate(-8 215 177)"/>
      <rect x="230" y="160" width="14" height="32" rx="2" fill="#5b4bdb"/>
      <rect x="252" y="161" width="14" height="31" rx="2" fill="#3f9d76" transform="rotate(6 259 176)"/>
      <rect x="276" y="163" width="14" height="29" rx="2" fill="#e5a13a"/>
      <rect x="298" y="160" width="14" height="32" rx="2" fill="#4a63c8"/>
      <rect x="320" y="162" width="14" height="30" rx="2" fill="#8b93bd"/>
      <rect x="342" y="163" width="14" height="29" rx="2" fill="#5b4bdb" transform="rotate(4 349 177)"/>
      <rect x="366" y="160" width="14" height="32" rx="2" fill="#e05c5c"/>
    </g>
    <g>
      <rect x="210" y="212" width="52" height="66" rx="4" fill="#f0f1f7" stroke="#c3c9e2"/>
      <rect x="270" y="212" width="52" height="66" rx="4" fill="#f0f1f7" stroke="#c3c9e2"/>
      <rect x="330" y="212" width="52" height="66" rx="4" fill="#f0f1f7" stroke="#c3c9e2"/>
      <rect x="220" y="224" width="32" height="5" rx="2.5" fill="#5b4bdb" opacity="0.7"/>
      <rect x="220" y="236" width="24" height="5" rx="2.5" fill="#c3c9e2"/>
      <rect x="280" y="224" width="32" height="5" rx="2.5" fill="#3f9d76" opacity="0.7"/>
      <rect x="280" y="236" width="24" height="5" rx="2.5" fill="#c3c9e2"/>
      <rect x="340" y="224" width="32" height="5" rx="2.5" fill="#e05c5c" opacity="0.7"/>
      <rect x="340" y="236" width="24" height="5" rx="2.5" fill="#c3c9e2"/>
    </g>
  </g>

  <!-- Bureau central -->
  <g>
    <rect x="560" y="300" width="520" height="22" rx="6" fill="url(#desk)"/>
    <rect x="590" y="322" width="30" height="120" fill="#444a68"/>
    <rect x="1010" y="322" width="30" height="120" fill="#3d425e"/>
    <rect x="560" y="436" width="520" height="10" rx="5" fill="#3d425e"/>

    <!-- Ordinateur -->
    <rect x="700" y="196" width="220" height="86" rx="8" fill="url(#mon)"/>
    <rect x="710" y="206" width="200" height="66" rx="4" fill="#4c5ad4" opacity="0.85"/>
    <rect x="722" y="216" width="90" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="722" y="232" width="120" height="6" rx="3" fill="#ffffff" opacity="0.55"/>
    <rect x="722" y="244" width="70" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
    <rect x="722" y="256" width="150" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="796" y="282" width="28" height="16" fill="#3a3f5c"/>
    <rect x="770" y="296" width="80" height="6" rx="3" fill="#3a3f5c"/>

    <!-- Documents fiscaux -->
    <g>
      <rect x="600" y="258" width="76" height="44" rx="4" fill="#ffffff" transform="rotate(-6 638 280)"/>
      <rect x="606" y="264" width="52" height="6" rx="3" fill="#5b4bdb" transform="rotate(-6 632 267)"/>
      <rect x="612" y="276" width="40" height="5" rx="2.5" fill="#c3c9e2" transform="rotate(-6 632 278)"/>
      <rect x="960" y="262" width="76" height="40" rx="4" fill="#ffffff" transform="rotate(5 998 282)"/>
      <rect x="968" y="270" width="50" height="6" rx="3" fill="#3f9d76" transform="rotate(5 993 273)"/>
      <rect x="972" y="282" width="38" height="5" rx="2.5" fill="#c3c9e2" transform="rotate(5 991 284)"/>
    </g>

    <!-- Tampon / tasse -->
    <rect x="1044" y="272" width="18" height="30" rx="4" fill="#8d94b8"/>
    <rect x="1041" y="266" width="24" height="8" rx="4" fill="#6b6f8f"/>
  </g>

  <!-- Pupitre secondaire gauche -->
  <g opacity="0.85">
    <rect x="60" y="330" width="300" height="16" rx="5" fill="#5a5f80"/>
    <rect x="80" y="346" width="20" height="96" fill="#4d5170"/>
    <rect x="320" y="346" width="20" height="96" fill="#454a66"/>
    <rect x="90" y="296" width="90" height="36" rx="4" fill="#e8eaf6" stroke="#b7bede"/>
    <rect x="100" y="306" width="60" height="5" rx="2.5" fill="#5b4bdb" opacity="0.7"/>
    <rect x="100" y="316" width="44" height="5" rx="2.5" fill="#c3c9e2"/>
    <rect x="210" y="302" width="110" height="30" rx="4" fill="#e8eaf6" stroke="#b7bede"/>
    <rect x="220" y="310" width="76" height="5" rx="2.5" fill="#3f9d76" opacity="0.7"/>
  </g>

  <!-- Lueur centrale douce (lisibilité) -->
  <rect y="330" width="1600" height="170" fill="url(#glow)" opacity="0.18"/>
</svg>
