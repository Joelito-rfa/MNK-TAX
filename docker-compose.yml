services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mnktax}
      POSTGRES_USER: ${POSTGRES_USER:-mnktax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mnktax}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnktax} -d ${POSTGRES_DB:-mnktax}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mnktax}
      DATABASE_USERNAME: ${POSTGRES_USER:-mnktax}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-mnktax}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlLW1lLWludGVybmFsLXNlY3JldC1mb3ItbW5rLXRheC1wcm90b3R5cGUtMDAx}
      SEED_DEMO: ${SEED_DEMO:-true}
      RECEIPT_BASE_URL: ${RECEIPT_BASE_URL:-http://localhost:3000}
      # Centre de communication — Email (SMTP réel)
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@mnk-tax.mg}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MNK-TAX — Administration fiscale}
      # Envois test (destination explicite uniquement)
      COMM_TEST_EMAIL: ${COMM_TEST_EMAIL:-}
      COMM_TEST_SMS: ${COMM_TEST_SMS:-}
      # Centre de communication — SMS (fournisseur réel)
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      SMS_ACCOUNT_SID: ${SMS_ACCOUNT_SID:-}
      SMS_AUTH_TOKEN: ${SMS_AUTH_TOKEN:-}
      SMS_FROM_NUMBER: ${SMS_FROM_NUMBER:-}
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
  backend-data:
